<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      .test {
        /* display: none; */
        opacity: 0;
      }
      .navbar {
        background-color: #f3f3f3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        width: 100%;
        top: 0px;
      }
      .logo_name {
        color: rgb(67, 46, 255);
        margin-left: 10px;
        cursor: pointer;
      }

      .nav_items ul {
        list-style-type: none;
        display: flex;
      }
      .nav_items li {
        margin: 10px;
      }
      .nav_items li a {
        padding: 10px 8px;
        text-decoration: none;
        color: black;
      }

      .nav_items li a:hover {
        text-decoration: underline;
      }

      .card {
        width: 250px;
        height: auto;
        /* background-color: rgb(34, 84, 250); */
        border-radius: 20px;

        margin: 40px auto;

        overflow: hidden;

        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
        /* -4px ပထမတစ်ခုဆိုရင် - ပါတဲ့အတွက် left, - မပါရင် right */
        /* -4px ဒုတိယတစ်ခုဆိုရင် - ပါတဲ့အတွက် top, - မပါရင် bottom */
      }

      .card_img {
        width: 100%;
        height: 150px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;

        /* background-color: rgb(34, 84, 250); */
        background-image: url(land.png);
        background-position: center;
      }

      .card_img img {
        width: 100px;
        /* height: 100px; */

        /* border-radius: 15px 50px 25px; */
        /* border-radiusမှာဆိုရင် left-top, right-top, right-bottom, left-bottom */

        border-radius: 50%;

        border: 2px solid white;
        padding: 3px;
      }
      .card_info {
        background-color: white;
        padding: 10px;
        text-align: center;
        height: 60%;
      }

      .card_info p {
        color: rgb(153, 152, 152);
      }

      .card_info a {
        text-decoration: none;
        color: white;
        background-color: rgb(34, 84, 250);
        padding: 5px 8px;
        display: inline-block;
        margin-top: 10px;

        border-radius: 4px;
      }

      .card_body {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
      }

      /* :hover */

      .card_info a:hover {
        /* background-color: rgb(34, 84, 250, 0.5); */
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1 class="logo_name">Hello</h1>
      <div class="nav_items">
        <ul>
          <li><a href="##">Home</a></li>
          <li><a href="">Blog</a></li>
          <li><a href="">About</a></li>
        </ul>
      </div>
    </div>

    <div class="card_body">
      <div class="card">
        <div class="card_img">
          <img src="avatar.png" alt="" />
        </div>
        <div class="card_info">
          <h2>Htet Wai</h2>
          <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Vero,
            consequatur ratione tempora vitae fugit inventore autem laboriosam
            omnis odio, ullam cumque totam cum, quis eos. Iste vitae nemo
            impedit praesentium?
          </p>
          <a href="#">View More</a>
        </div>
      </div>
    </div>
  </body>
</html>
