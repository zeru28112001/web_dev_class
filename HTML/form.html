<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <!-- (text, button, checkbox, email, file, radio, password, tel, number, date,) -->


        <label for="text1">Text only default:</label>
        <input type="text" id="text1" name="text1" placeholder="Enter text here" required>
        <!-- type="text" default -->

        <br> <br>

        <label>Button:</label>
        <input type="button" value="Click Me">

        <br> <br>

        <label for="check">Option 1:</label>
        <input type="checkbox" id="check" value="option1"> 

        <label for="check2">Option 2:</label>
        <input type="checkbox" id="check2" value="option2"> 

        <br> <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email"><!--format စစ်ပီးသား-->

        <br> <br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">

        <br> <br>

        <!-- Radio Buttons -> မှာဆိုရင် name တူ radio အလုပ်လုပ်တာ -->
        <span>Radio:</span>
        <input type="radio" name="gender" value="male" id="male"> <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female"> <label for="female">Female</label>

        <br> <br>

        <label>File:</label>
        <input type="file">

        <br> <br>

        <label for="number">Number:</label>
        <input type="number" id="number">

        <br> <br>

        <!-- Telephone Input -> Text ပေးသင့်တယ် ဘာလို့လဲဆိုတော့ + ပါတဲ့အတွက်ကြောင့်  -->
        <label for="tel">Telephone:</label>
        <input type="tel" id="tel" placeholder="Enter your phone number">
        
        <br> <br>

        <label for="date">Date:</label>
        <input type="date" id="date">

        <br> <br>

        <label for="textarea"><p></p></label>
        <textarea cols="20" rows="5" id="textarea" placeholder="Enter your message here..." required></textarea>

        <!-- Select -->
        <br> <br>
        <label >Select:</label>
        <select >
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select> 
        <!-- required ထည့်ရတာက input တွေရှိမယ် textarea တွေရှိမယ် -->

        <!-- value ပါ ကို ပါရမဲ့ဟာက checkbox နဲ့ radio button တို့ပဲဖြစ်ပါတယ်။ select မှာတော့ option value ကိုပဲသတ်မှတ်နိုင်ပါတယ်။ -->
    
        <!-- input or button -->

        <br> <br>

        <input type="submit" value="Submit">

        <button type="submit">Submit</button>

        <input type="reset" value="Reset">


    </form>


    <br> <br>
    
    <hr>

    <!-- strong, em, code, pre -->
    <strong>This is bold text</strong> <!-- ->bold<b> နဲ့တူတူပဲ -->
    <br>
    <em>This is italic text</em> <!-- ->italic<i> နဲ့တူတူပဲ -->
    <br>
    <code>This is code</code>
    <pre>This is preformatted text</pre>
</body>
</html>
