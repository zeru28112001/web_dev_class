<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This is table lesson</h1>

    <!-- rowspan = 2, colspan = 2 -->
    <br>
    <table border="1">
        <tr>
            <td rowspan="2">No.</td>
            <td>Name</td>
        </tr>
        <tr>
            
            <td>Wai Yan</td>
        </tr>
        <tr>
            <td>No.2</td>
            <td>Ko Ko</td>
        </tr>
    </table>
    <br>
    <table border="1">
        <tr>
            <td>No.</td>
            <td colspan="3">Name</td>
        </tr>
        <tr>
            <td>1</td>
            <td>Wai Yan</td>
            <td>Ko Ko</td>
            <td>Ko Ko</td>
        </tr>
        <!-- 
        <th>

        </th>
        <thead>

        </thead>
        <tfoot>

        </tfoot>
         -->
    </table>

    <br>
    <table border="1">
        <tr>
            <td rowspan="3">Name</td>
        </tr>
        <tr>
            <td>No.1</td>
        </tr>
        <tr>
            <td>No.2</td>
            <td>No.2</td>
        </tr>
        <tr>
            <td>No.3</td>
            <td>No.3</td>
        </tr>
    </table>

</body>
</html>
